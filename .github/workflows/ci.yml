name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --frozen
        working-directory: services/api
      - run: uv run ruff check .
        working-directory: services/api
      - run: uv run pytest
        working-directory: services/api

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.16"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
        working-directory: apps/dashboard
      - run: npm run test:reports
        working-directory: apps/dashboard
      - run: npm run test:knowledge
        working-directory: apps/dashboard
      - run: npm run test:requests
        working-directory: apps/dashboard
      - run: npm run test:auth
        working-directory: apps/dashboard
      - run: npm run test:dashboard
        working-directory: apps/dashboard
      - run: npm run test:readiness
        working-directory: apps/dashboard
      - run: npm run lint
        working-directory: apps/dashboard
      - run: npm run build
        working-directory: apps/dashboard
      - run: npx tsc --noEmit
        working-directory: apps/dashboard

  openclaw-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.16"
      - run: npm test
        working-directory: integrations/openclaw/plugins/laporpak-tools
      - run: node fts-recall.js
        working-directory: integrations/openclaw/evals
      - run: node runner.js --file report-p0.json
        working-directory: integrations/openclaw/evals
      - run: node runner.js --file error-attack-p0.json
        working-directory: integrations/openclaw/evals
      - run: node runner.js --file referral-m2.json
        working-directory: integrations/openclaw/evals
